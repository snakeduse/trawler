schema: spec-driven

context: |
  Trawler — встраиваемое приложение Erlang/OTP 27 с отдельным CLI в формате escript.
  Библиотека подключается как зависимость других Erlang-приложений, подобно Cowboy.
  Код приложения пишется на Erlang; Node/OpenSpec и Hermes нужны для разработки.
  Первая версия сканера использует TCP connect без повышенных привилегий и IPv4:
  отдельные адреса, списки, включительные диапазоны IP, CIDR, номера и диапазоны портов.
  Нужны синхронный и асинхронный API, статус, отмена и поток результатов.
  Реализовано также обнаружение хостов IPv4 (`trawler:discover/2` и команда discover):
  ARP, ICMP echo/timestamp, TCP SYN/ACK и TCP connect с маршрутным выбором; raw-методы
  ограничены Linux и требуют сетевых привилегий, TCP connect доступен без root.
  Ограничивать соединения глобально и для каждого сканирования; создавать задания
  по мере необходимости и освобождать все ресурсы.
  TCP-таймаут не доказывает отсутствие хоста или фильтрацию порта.
  discover поддерживает необязательные проверки выбранных портов без фильтрации IP
  и отключаемое приблизительное определение Windows/Linux/unknown с основаниями.
  IPv6, UDP, полноценный fingerprinting ОС, распознавание сервисов и веб-интерфейс — будущие задачи.
  Документы OpenSpec, AGENTS.md, инструкции проекта, обсуждения и README писать по-русски.
  Стандартные навыки .hermes/skills/*/SKILL.md оставлять в исходном английском виде.
  Сохранять имена API, команды, ключи конфигурации и машинные маркеры OpenSpec:
  Purpose, Requirements, Requirement:, Scenario:, ADDED/MODIFIED/REMOVED/RENAMED
  Requirements, WHEN, THEN, AND, SHALL и MUST. SHALL/MUST означают «должно».
  Согласованно переводить названия требований и сценариев в основной и delta-спецификациях.
  Текущие основные спецификации описывают реализованное поведение. Требования
  активного изменения остаются в его delta-спецификациях до завершения кода, тестов и проверки.
  Пользователь явно разрешил автоматический переход от планирования к реализации
  в запросах на разработку. В этом цикле создавать документы через инструкции CLI;
  отдельный навык openspec-propose предназначен только для планирования.

rules:
  proposal:
    - Указывать нужную возможность, влияние на приложение и явные исключения.
  design:
    - До делегирования определить публичные контракты Erlang и жизненный цикл ресурсов при ошибках.
    - Описывать проверки адресов, параллелизм, предельные сроки и отмену с тестами на loopback.
  specs:
    - Отделять наблюдаемые результаты TCP от выводов о доступности хоста.
  tasks:
    - Делать задачи реализации ограниченными и независимо проверяемыми основным агентом.
    - Включать EUnit, Common Test, Xref, Dialyzer и строгую валидацию OpenSpec.

operations:
  apply:
    guidance:
      - Pro планирует и проверяет документы, затем автоматически поручает реализацию Flash.
      - Использовать одного исполнителя одновременно и передавать полный контекст и критерии приёмки.
      - Запросы только на планирование или каркас оставляют будущие задачи реализации без отметок.
  archive:
    guidance:
      - Архивировать только после завершения всех задач, успешного make check и проверки diff агентом Pro.
