# Основная конфигурация. scripts/hermes создаёт рабочую копию в .hermes/runtime/config.yaml.
_config_version: 50

model:
  provider: openai-codex
  default: gpt-6.1-sol
  api_mode: codex_responses
fallback_providers: []

terminal:
  backend: local
  cwd: ${TRAWLER_ROOT}

platform_toolsets:
  cli: [terminal, file, skills, delegation, todo, clarify]

skills:
  # Явный каталог навыков поддерживается и в версиях Hermes без поиска навыков проекта.
  external_dirs:
    - ${TRAWLER_ROOT}/.hermes/skills
  project_discovery: false

delegation:
  provider: deepseek
  model: deepseek-flash
  fallback_providers: []
  max_concurrent_children: 1
  max_spawn_depth: 1
  orchestrator_enabled: false
  worktree_isolation: false

agent:
  max_turns: 60
  reasoning_effort: medium

auxiliary:
  background_review:
    enabled: true

checkpoints:
  enabled: true
