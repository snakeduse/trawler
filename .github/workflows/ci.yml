name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3.4.18'
          rebar3-version: '3.27.3'
          version-type: strict
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install global OpenSpec
        run: npm install -g @fission-ai/openspec@1.14.1
      - name: Cache Dialyzer PLT
        uses: actions/cache@v4
        with:
          path: ~/.cache/rebar3
          key: plt-${{ runner.os }}-otp27.3.4.18-rebar3.27.3-${{ hashFiles('rebar.config', 'rebar.lock') }}
      - name: Build and validate
        run: make check
      - name: Upload CLI
        uses: actions/upload-artifact@v4
        with:
          name: trawler-escript-otp27
          path: _build/default/bin/trawler
